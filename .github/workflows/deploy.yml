name: Publicar sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir sitio
        run: mkdir _site && unzip -q marialeurdaneta_sitio.zip -d _site && ls -la _site
      - name: Correo de contacto
        run: sed -i 's/maria\.urdaneta@neurowellnesslearning\.com/info@marialeurdaneta.com/g' _site/index.html && grep -c 'info@marialeurdaneta.com' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
